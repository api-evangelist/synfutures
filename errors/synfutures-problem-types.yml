    title: Unauthorized
    detail: >-
      Authentication failed - invalid/expired API key, bad HMAC signature,
      timestamp drift beyond 45s, or a key with an empty/unset IP whitelist
      (which rejects all requests).
    remediation: Verify key validity, IP whitelist, timestamp within 45s, and signature computation.
  - code: 429
    http_status: 429
    title: Too Many Requests
    detail: Rate limit exceeded (1,200 requests/min/IP; may vary by endpoint and load).
    remediation: Back off and retry; reduce request rate.
