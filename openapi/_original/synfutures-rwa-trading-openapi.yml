        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/orders/tx:
    post:
      operationId: recordOrderTx
      tags: [Orders]
      summary: Record order tx
      description: Records a self-submitted order transaction hash.
      requestBody: { $ref: '#/components/requestBodies/Generic' }
