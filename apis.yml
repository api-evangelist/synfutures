aid: synfutures
name: SynFutures
description: >-
  SynFutures is an on-chain derivatives and real-world-asset (RWA) trading
  protocol that brings crypto perpetuals, tokenized stocks, and ETFs on-chain
  across Base, Ethereum, and Monad. For developers it exposes a RESTful RWA
  Trading API (market data, portfolio, order placement, cash and stock
  operations, and One Click delegated trading) secured with HMAC-SHA256 signed,
  IP-whitelisted API keys, plus TypeScript SDKs (@synfutures/sdks-perp and
  oyster-sdk) and on-chain smart contracts for the Oyster (V3) protocol.
  Backed by Pantera Capital and Polychain.
